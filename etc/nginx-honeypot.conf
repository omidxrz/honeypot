# The Bait Name in server_name is a placeholder until hp-cert rewrites it on
# issuance. The Name itself is decided in etc/names.env, which also generates
# the $hp_host_class map that drives capture-time redaction. See CONTEXT.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name HONEYPOT_FQDN _;

    ssl_certificate     /etc/letsencrypt/live/HONEYPOT_FQDN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HONEYPOT_FQDN/privkey.pem;

    root /opt/honeypot/bait;
    index index.html;

    access_log /opt/honeypot/logs/web.jsonl hp;
    error_log  /var/log/nginx/hp-error.log crit;

    server_tokens off;
    add_header X-Powered-By "PHP/7.4.33" always;
    client_max_body_size 8m;
    client_body_buffer_size 1m;

    # every write goes to the shim so nginx reads (and logs) the body
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://127.0.0.1:8099; }
        try_files $uri $uri/ /index.html;
    }

    location = /login   { proxy_pass http://127.0.0.1:8099; }
    location /api/      { proxy_pass http://127.0.0.1:8099; }
    location /dashboard { try_files $uri /index.html; }

    error_page 401 402 403 404 405 500 502 503 =200 /index.html;
}
