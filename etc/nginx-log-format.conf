# Capture format for the bait site.
#
# Requests arriving under a Foreign Name are traffic meant for someone else --
# a dangling DNS record pointing here. We keep the fact of them, never their
# credentials: auth, cookie and body are blanked at capture, so they are never
# written to disk at all. See CONTEXT.md.
#
# etc/nginx-hostmap.conf defines $hp_host_class and is generated from
# etc/names.env by ops/deploy.sh. Include it before this file.

map $hp_host_class $hp_auth   { default $http_authorization; foreign ""; }
map $hp_host_class $hp_cookie { default $http_cookie;        foreign ""; }
map $hp_host_class $hp_body   { default $request_body;       foreign ""; }

log_format hp escape=json '{"t":"$time_iso8601","src":"web","ip":"$remote_addr","sport":$remote_port,'
  '"m":"$request_method","u":"$request_uri","h":"$http_host","hc":"$hp_host_class",'
  '"st":$status,"scheme":"$scheme",'
  '"ua":"$http_user_agent","ref":"$http_referer","xff":"$http_x_forwarded_for",'
  '"ct":"$http_content_type","auth":"$hp_auth","ck":"$hp_cookie",'
  '"n":$request_length,"body":"$hp_body"}';
